# Demo seed data (DR-10). owner resolves against users.yaml by email.
# SOA and apex NS are NOT listed here — hosted_zone_service.create_zone() generates
# them the same way a real zone create does (Slice 1's acceptance criterion).
#
# example.com is the flagship zone: >=25 record sets spanning all nine types
# (extends the worked example from 05-data-model.md §7 with AAAA, PTR, and SRV).

- name: example.com
  type: PUBLIC
  description: Primary production zone
  owner: admin@example.com
  tags: { Environment: production, Team: platform }
  records:
    - { name: example.com,             type: A,     ttl: 300,   values: [192.0.2.1] }
